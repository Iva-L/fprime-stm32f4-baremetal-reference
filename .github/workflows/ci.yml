name: fprime-stm32f4-baremetal-reference CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-fprime-baremetal-reference:
    name: Cross-Compile fprime-stm32f4-baremetal-reference and test (STM32F4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ARM GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev

      - name: Install F' Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r lib/fprime/requirements.txt

      - name: Verify Environment
        run: |
          arm-none-eabi-gcc --version
          arm-none-eabi-g++ --version

      - name: Clean Previous Build Artifacts
        run: |
          # Removes the existing CMake cache and build files to ensure a clean build
          fprime-util purge -f

      - name: Generate CMake Cache
        run: |
          # Generates build files targeting stm32f4 baremetal platform
          fprime-util generate -f

      - name: Cross-Compile F' Binary
        run: |
          # Builds the ReferenceDeployment executable
          fprime-util build